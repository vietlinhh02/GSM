name: gsmvoicee-backend

services:
  postgres:
    image: postgres:18.6-alpine3.23
    container_name: gsmvoicee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gsmvoicee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsmvoicee_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gsmvoicee}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gsmvoicee} -d ${POSTGRES_DB:-gsmvoicee}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  postgres_data:
    name: gsmvoicee_postgres_data
